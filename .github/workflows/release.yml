name: Release

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify tag, tests, advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match Cargo.toml version
        run: |
          CARGO_VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          [ "v${CARGO_VERSION}" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != Cargo.toml v${CARGO_VERSION}"; exit 1; }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny
      - run: cargo audit --deny warnings --ignore RUSTSEC-2025-0119
      - run: cargo deny check
      - run: cargo test --locked

  build:
    name: Build (${{ matrix.target }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: aarch64-apple-darwin,       os: macos-latest,     smoke: true }
          - { target: x86_64-apple-darwin,        os: macos-latest,     smoke: false }
          - { target: x86_64-unknown-linux-musl,  os: ubuntu-latest,    smoke: true }
          - { target: aarch64-unknown-linux-gnu,  os: ubuntu-24.04-arm, smoke: true }
          - { target: x86_64-pc-windows-msvc,     os: windows-latest,   smoke: true }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: musl toolchain
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: scripts/package.sh "${{ matrix.target }}" "${GITHUB_REF_NAME}"
      - name: Smoke test packaged binary
        if: matrix.smoke
        shell: bash
        run: |
          mkdir smoke && cd smoke
          case "${{ matrix.target }}" in
            *windows*) 7z x -bso0 ../dist/sentris-*.zip && ./sentris.exe --version ;;
            *) tar -xzf ../dist/sentris-*.tar.gz && ./sentris --version ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Checksums, SBOM, attestation, release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true
      - uses: dtolnay/rust-toolchain@stable
      - name: SBOM (CycloneDX)
        run: |
          cargo install --locked cargo-cyclonedx
          cargo cyclonedx --format json --spec-version 1.5
          mv sentris.cdx.json "dist/sentris-${GITHUB_REF_NAME}.sbom.cdx.json"
      - name: SHA256SUMS
        run: cd dist && sha256sum sentris-*.tar.gz sentris-*.zip > SHA256SUMS && cat SHA256SUMS
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/sentris-*"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRE=""
          case "${GITHUB_REF_NAME}" in v0.*|*-*) PRE="--prerelease" ;; esac
          gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --generate-notes --title "${GITHUB_REF_NAME}" $PRE
