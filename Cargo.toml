[package]
name = "sentris"
version = "0.1.0"
edition = "2021"
authors = ["Sentris Contributors"]
description = "High-performance, memory-safe, zero-knowledge secret scanner with autonomous remediation."
license = "MIT"
readme = "README.md"
repository = "https://github.com/Bharath-code/sentris"
homepage = "https://github.com/Bharath-code/sentris"
keywords = ["security", "secrets", "scanner", "remediation", "git-hook"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
rayon = "1.10"
ignore = "0.4"
regex = "1.11"
aho-corasick = "1.1"
regex-syntax = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
comfy-table = "7.1"
owo-colors = "4.1"
thiserror = "2.0"
anyhow = "1.0"
sha2 = "0.10"
hex = "0.4"
getrandom = "0.2"
indicatif = "0.17"
ureq = { version = "2.10", default-features = false, features = ["tls", "json"] }
ratatui = "0.30.2"
crossterm = "0.29.0"

[dev-dependencies]
tempfile = "3.17"

[lints.clippy]
unwrap_used = "deny"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
